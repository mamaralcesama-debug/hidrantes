<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Monitoramento - Hidrantes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    .hidrante-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #f1f5f9;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .badge-normal {
      background-color: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }

    .badge-alerta {
      background-color: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #dc2626;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .info-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .foto-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #020617;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
    }

    .foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      cursor: pointer;
    }

    .sem-foto {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px;
    }

    .btn-hd {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: none;
    }

    .btn-hd:hover {
      background-color: #0369a1;
    }

    .btn-hd:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Central de Monitoramento</h1>
    <div class="subtitle">Sistema de Gestão e Segurança de Hidrantes</div>
  </header>

  <main class="card">
    <div class="card-header">
      <div class="hidrante-title">HIDRANTE-001</div>
      <div id="badgeStatus" class="status-badge badge-normal">🟢 NORMAL (HEARTBEAT)</div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Último Evento</div>
        <div id="lblEvento" class="info-value">Aguardando...</div>
      </div>
      <div class="info-item">
        <div class="info-label">Bateria</div>
        <div id="lblBateria" class="info-value">--</div>
      </div>
      <div class="info-item" style="grid-column: span 2;">
        <div class="info-label">Horário do Evento</div>
        <div id="lblHorario" class="info-value">--:--:--</div>
      </div>
    </div>

    <div class="foto-container">
      <div id="txtSemFoto" class="sem-foto">Aguardando registro de foto...</div>
      <img id="imgUltimaFoto" alt="Última foto registrada" onclick="solicitarFotoHD()" />
    </div>

    <button id="btnPedirHD" class="btn-hd" onclick="solicitarFotoHD()">📷 Solicitar Foto em HD</button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, query, limitToLast, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4",
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ID_HIDRANTE = "HIDRANTE-001";
    let ultimoEventKey = null;
    let aguardandoHD = false;
    let urlBlobHDLocal = null; // Armazena a referência da foto baixada no PC

    function carregarEProcessarAlerta() {
      const historicoRef = query(ref(db, `historico_hidrantes/${ID_HIDRANTE}`), limitToLast(1));

      onValue(historicoRef, (snapshot) => {
        const dados = snapshot.val();
        if (!dados) return;

        const keys = Object.keys(dados);
        const novaChave = keys[0];

        // Se o evento mudou (novo alerta), reseta o arquivo local antigo
        if (ultimoEventKey !== novaChave) {
          ultimoEventKey = novaChave;
          if (urlBlobHDLocal) {
            URL.revokeObjectURL(urlBlobHDLocal);
            urlBlobHDLocal = null;
          }
          aguardandoHD = false;
        }

        const evento = dados[ultimoEventKey];

        // Atualização dos indicadores na tela
        document.getElementById('lblEvento').textContent = evento.evento || 'OK';
        document.getElementById('lblBateria').textContent = evento.bateria_volts ? `${evento.bateria_volts}V` : 'N/A';
        
        if (evento.timestamp_servidor) {
          const data = new Date(evento.timestamp_servidor);
          document.getElementById('lblHorario').textContent = data.toLocaleTimeString('pt-BR');
        } else {
          document.getElementById('lblHorario').textContent = new Date().toLocaleTimeString('pt-BR');
        }

        const badge = document.getElementById('badgeStatus');
        if (evento.evento === 'ALERTA_MOVIMENTO') {
          badge.textContent = '🚨 MOVIMENTO DETECTADO';
          badge.className = 'status-badge badge-alerta';
        } else {
          badge.textContent = '🟢 NORMAL (HEARTBEAT)';
          badge.className = 'status-badge badge-normal';
        }

        const imgElement = document.getElementById('imgUltimaFoto');
        const txtSemFoto = document.getElementById('txtSemFoto');
        const btnPedirHD = document.getElementById('btnPedirHD');

        // 1. Exibição da Thumbnail e configuração do botão
        if (evento.thumb_base64) {
          imgElement.src = evento.thumb_base64;
          imgElement.style.display = 'block';
          txtSemFoto.style.display = 'none';
          btnPedirHD.style.display = 'block';

          if (urlBlobHDLocal) {
            btnPedirHD.textContent = '🔍 Visualizar Foto HD Salva';
            btnPedirHD.disabled = false;
          } else if (aguardandoHD) {
            btnPedirHD.textContent = '⏳ Baixando foto HD do celular...';
            btnPedirHD.disabled = true;
          } else {
            btnPedirHD.textContent = '📷 Solicitar Foto em HD';
            btnPedirHD.disabled = false;
          }
        } else {
          imgElement.style.display = 'none';
          txtSemFoto.style.display = 'block';
          btnPedirHD.style.display = 'none';
        }

        // 2. Quando a foto_full chega do celular
        if (evento.foto_full) {
          processarEApagarFotoHD(evento.foto_full, ultimoEventKey);
        }
      });
    }

    // Baixa a imagem no PC, gera URL local para abrir e remove do Firebase
    async function processarEApagarFotoHD(base64Data, eventKey) {
      try {
        const res = await fetch(base64Data);
        const blob = await res.blob();
        
        if (urlBlobHDLocal) URL.revokeObjectURL(urlBlobHDLocal);
        urlBlobHDLocal = URL.createObjectURL(blob);

        // Download silencioso para a pasta de Downloads do computador
        const a = document.createElement('a');
        a.href = urlBlobHDLocal;
        const dataFormatada = new Date().toISOString().replace(/[:.]/g, '-');
        a.download = `ALERTA_${ID_HIDRANTE}_${dataFormatada}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        console.log("💾 Foto HD baixada com sucesso para a pasta de Downloads!");

        // Remove a imagem HD do Firebase para economizar espaço
        await remove(ref(db, `historico_hidrantes/${ID_HIDRANTE}/${eventKey}/foto_full`));
        console.log("🧹 Foto HD removida do Firebase com sucesso.");

        aguardandoHD = false;
        
        const btnPedirHD = document.getElementById('btnPedirHD');
        btnPedirHD.textContent = '🔍 Visualizar Foto HD Salva';
        btnPedirHD.disabled = false;

      } catch (err) {
        console.error("Erro ao processar e baixar imagem HD:", err);
      }
    }

    // Clique na imagem ou no botão
    window.solicitarFotoHD = async function() {
      // Se a foto já foi baixada no PC, abre em uma nova aba diretamente
      if (urlBlobHDLocal) {
        window.open(urlBlobHDLocal, '_blank');
        return;
      }

      if (!ultimoEventKey || aguardandoHD) return;
      
      const btnPedirHD = document.getElementById('btnPedirHD');
      aguardandoHD = true;
      btnPedirHD.textContent = '⏳ Solicitando ao celular...';
      btnPedirHD.disabled = true;

      try {
        await push(ref(db, 'solicitacoes_foto'), {
          idHidrante: ID_HIDRANTE,
          evento_id: ultimoEventKey,
          atendido: false,
          timestamp: new Date().toISOString()
        });
      } catch (e) {
        alert("Erro ao enviar solicitação ao Firebase: " + e.message);
        aguardandoHD = false;
        btnPedirHD.textContent = '📷 Solicitar Foto em HD';
        btnPedirHD.disabled = false;
      }
    };

    carregarEProcessarAlerta();
  </script>
</body>
</html>
