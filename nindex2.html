<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, query, limitToLast, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4",
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ID_HIDRANTE = "HIDRANTE-001";
    let ultimoEventKey = null;
    let aguardandoHD = false;
    let urlBlobHDLocal = null; // Guarda a foto baixada no computador local

    function carregarEProcessarAlerta() {
      const historicoRef = query(ref(db, `historico_hidrantes/${ID_HIDRANTE}`), limitToLast(1));

      onValue(historicoRef, (snapshot) => {
        const dados = snapshot.val();
        if (!dados) return;

        const keys = Object.keys(dados);
        ultimoEventKey = keys[0];
        const evento = dados[ultimoEventKey];

        // Atualização dos status na interface
        document.getElementById('lblEvento').textContent = evento.evento || 'OK';
        document.getElementById('lblBateria').textContent = evento.bateria_volts ? `${evento.bateria_volts}V` : 'N/A';
        
        if (evento.timestamp_servidor) {
          const data = new Date(evento.timestamp_servidor);
          document.getElementById('lblHorario').textContent = data.toLocaleTimeString('pt-BR');
        } else {
          document.getElementById('lblHorario').textContent = new Date().toLocaleTimeString('pt-BR');
        }

        const badge = document.getElementById('badgeStatus');
        if (evento.evento === 'ALERTA_MOVIMENTO') {
          badge.textContent = '🚨 MOVIMENTO DETECTADO';
          badge.className = 'status-badge badge-alerta';
        } else {
          badge.textContent = '🟢 NORMAL (HEARTBEAT)';
          badge.className = 'status-badge badge-normal';
        }

        const imgElement = document.getElementById('imgUltimaFoto');
        const txtSemFoto = document.getElementById('txtSemFoto');
        const btnPedirHD = document.getElementById('btnPedirHD');

        // 1. Exibe a Thumbnail se ela existir
        if (evento.thumb_base64) {
          imgElement.src = evento.thumb_base64;
          imgElement.style.display = 'block';
          txtSemFoto.style.display = 'none';
          btnPedirHD.style.display = 'block';

          if (urlBlobHDLocal) {
            btnPedirHD.textContent = '🔍 Visualizar Foto HD Salva';
            btnPedirHD.disabled = false;
          } else if (aguardandoHD) {
            btnPedirHD.textContent = '⏳ Baixando foto HD do celular...';
            btnPedirHD.disabled = true;
          } else {
            btnPedirHD.textContent = '📷 Solicitar Foto em HD';
            btnPedirHD.disabled = false;
          }
        } else {
          imgElement.style.display = 'none';
          txtSemFoto.style.display = 'block';
          btnPedirHD.style.display = 'none';
        }

        // 2. Quando a foto_full chega do celular: Baixa no PC e APAGA do Firebase
        if (evento.foto_full) {
          processarEApagarFotoHD(evento.foto_full, ultimoEventKey);
        }
      });
    }

    // Baixa o arquivo para o PC, guarda o ponteiro local e limpa o Firebase
    async function processarEApagarFotoHD(base64Data, eventKey) {
      try {
        // Converte Base64 para Blob local
        const res = await fetch(base64Data);
        const blob = await res.blob();
        
        // Se havia um blob antigo na memória, revoga para economizar RAM do PC
        if (urlBlobHDLocal) URL.revokeObjectURL(urlBlobHDLocal);
        urlBlobHDLocal = URL.createObjectURL(blob);

        // Dispara o download físico para a pasta de Downloads do computador
        const a = document.createElement('a');
        a.href = urlBlobHDLocal;
        const dataFormatada = new Date().toISOString().replace(/[:.]/g, '-');
        a.download = `ALERTA_${ID_HIDRANTE}_${dataFormatada}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        console.log("💾 Arquivo HD salvo nos Downloads do PC!");

        // --- APAGA A FOTO HD DO FIREBASE PARA NÃO PESAR ---
        await remove(ref(db, `historico_hidrantes/${ID_HIDRANTE}/${eventKey}/foto_full`));
        console.log("🧹 Foto HD deletada do Firebase com sucesso para economizar espaço.");

        aguardandoHD = false;
        
        const btnPedirHD = document.getElementById('btnPedirHD');
        btnPedirHD.textContent = '🔍 Visualizar Foto HD Salva';
        btnPedirHD.disabled = false;

      } catch (err) {
        console.error("Erro ao processar foto HD:", err);
      }
    }

    // Clique no botão / thumbnail
    window.solicitarFotoHD = async function() {
      // Se a foto HD já foi baixada localmente para o PC, abre em uma nova aba
      if (urlBlobHDLocal) {
        window.open(urlBlobHDLocal, '_blank');
        return;
      }

      if (!ultimoEventKey || aguardandoHD) return;
      
      const btnPedirHD = document.getElementById('btnPedirHD');
      aguardandoHD = true;
      btnPedirHD.textContent = '⏳ Solicitando ao celular...';
      btnPedirHD.disabled = true;

      try {
        await push(ref(db, 'solicitacoes_foto'), {
          idHidrante: ID_HIDRANTE,
          evento_id: ultimoEventKey,
          atendido: false,
          timestamp: new Date().toISOString()
        });
      } catch (e) {
        alert("Erro ao solicitar foto HD: " + e.message);
        aguardandoHD = false;
        btnPedirHD.textContent = '📷 Solicitar Foto em HD';
        btnPedirHD.disabled = false;
      }
    };

    carregarEBaixarAlerta();
  </script>
