<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Monitoramento - Hidrantes</title>
  
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 15px; }
    h2 { color: #00d2d3; margin-top: 0; }
    
    .card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .alerta { border-color: #ff4d4d; background: #2a1a1a; }
    
    .status { font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .status-ok { background: #10ac84; color: #fff; }
    .status-alerta { background: #ee5253; color: #fff; }
    
    .img-container { margin-top: 10px; background: #000; text-align: center; border-radius: 6px; padding: 5px; min-height: 100px; }
    .img-container img { max-width: 100%; height: auto; border-radius: 4px; }
    
    button { background: #2e86de; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
    button:hover { background: #54a0ff; }
    
    /* Modal de Foto HD */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; z-index: 1000; }
    .modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
    .fechar { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; }
  </style>

  <!-- SDK Compatível do Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>📋 Painel de Monitoramento</h2>
  <div id="painel-hidrantes">Carregando dados do Firebase...</div>

  <!-- Modal para Foto HD -->
  <div id="modalHD" class="modal">
    <span class="fechar" onclick="fecharModal()">&times;</span>
    <div id="conteudoModal"></div>
  </div>

  <script>
    // --- CONFIGURAÇÃO DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4", 
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const hidrantesCadastrados = ["HIDRANTE-001", "HIDRANTE-002"];

    // --- MONITORAMENTO EM TEMPO REAL ---
    database.ref('historico_hidrantes').on('value', (snapshot) => {
      const dados = snapshot.val() || {};
      const container = document.getElementById('painel-hidrantes');
      container.innerHTML = '';

      hidrantesCadastrados.forEach(idHidrante => {
        let eventosDoHidrante = dados[idHidrante] || {};

        // Busca registros gravados na raiz caso não estejam dentro do ID
        if (Object.keys(eventosDoHidrante).length === 0) {
          Object.keys(dados).forEach(chave => {
            if (dados[chave].evento) {
              eventosDoHidrante[chave] = dados[chave];
            }
          });
        }

        const chaves = Object.keys(eventosDoHidrante);
        let ultimoEvento = null;
        let chaveUltimoEvento = null;

        if (chaves.length > 0) {
          chaveUltimoEvento = chaves[chaves.length - 1];
          ultimoEvento = eventosDoHidrante[chaveUltimoEvento];
        }

        const ts = ultimoEvento ? (ultimoEvento.timestamp_servidor || ultimoEvento.timestamp || 0) : 0;
        const agora = Date.now();
        const ehAlerta = ultimoEvento && ultimoEvento.evento === "ALERTA_MOVIMENTO" && (agora - ts < 600000);

        const card = document.createElement('div');
        card.className = `card ${ehAlerta ? 'alerta' : ''}`;

        const dataStr = ts ? new Date(ts).toLocaleString('pt-BR') : 'Sem registros';
        const statusClass = ehAlerta ? 'status-alerta' : 'status-ok';
        const statusTexto = ehAlerta ? '🚨 MOVIMENTO DETECTADO' : '🟢 NORMAL';

        let imagemHTML = `<p style="color:#888;">Sem imagem gravada</p>`;
        if (ultimoEvento && ultimoEvento.thumb_base64) {
          imagemHTML = `<img src="${ultimoEvento.thumb_base64}" alt="Thumb Alerta">`;
        }

        card.innerHTML = `
          <h3>${idHidrante} <span class="status ${statusClass}">${statusTexto}</span></h3>
          <p><strong>Última atualização:</strong> ${dataStr}</p>
          <p><strong>Evento:</strong> ${ultimoEvento ? ultimoEvento.evento : 'Nenhum'}</p>
          <div class="img-container">
            ${imagemHTML}
          </div>
          ${ultimoEvento ? `
            <button onclick="solicitarFotoFull('${idHidrante}', '${chaveUltimoEvento}')">
              📷 Solicitar Foto HD
            </button>
          ` : ''}
        `;

        container.appendChild(card);
      });
    });

    // --- SOLICITAÇÃO E EXIBIÇÃO DA FOTO HD ---
    function solicitarFotoFull(idHidrante, chavePush) {
      const modal = document.getElementById('modalHD');
      const conteudo = document.getElementById('conteudoModal');

      conteudo.innerHTML = `<p style="color:#fff;">📡 Solicitando foto HD para o dispositivo...</p>`;
      modal.style.display = 'flex';

      // Envia pedido para o nó de solicitações
      database.ref('solicitacoes_foto').push({
        id_hidrante: idHidrante,
        evento_id: chavePush,
        timestamp: Date.now(),
        atendido: false
      });

      const escutarCaminho = (caminho) => {
        const ref = database.ref(`${caminho}/foto_full`);
        const listener = ref.on('value', (snap) => {
          const fotoData = snap.val();
          if (fotoData) {
            conteudo.innerHTML = `
              <img src="${fotoData}" alt="Foto HD">
              <br><br>
              <a href="${fotoData}" download="FOTO_${chavePush}.jpg" style="color:#00d2d3; font-weight:bold;">💾 Baixar Imagem</a>
            `;
            ref.off('value', listener);
          }
        });
      };

      // Tenta escutar nos dois caminhos possíveis do banco
      escutarCaminho(`historico_hidrantes/${idHidrante}/${chavePush}`);
      escutarCaminho(`historico_hidrantes/${chavePush}`);
    }

    function fecharModal() {
      document.getElementById('modalHD').style.display = 'none';
    }
  </script>
</body>
</html>
