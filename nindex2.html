<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Monitoramento - Tampas de Hidrantes</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    header { background-color: #11111b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
    header h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; color: #ff4757; display: flex; align-items: center; gap: 10px; }
    .status-bar { font-size: 0.85rem; background: #2f3542; padding: 5px 12px; border-radius: 20px; color: #2ed573; font-weight: bold; }

    /* Layout Main */
    .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }

    /* Painel Lateral */
    .sidebar { width: 450px; background-color: #181824; border-right: 1px solid #2d2d3f; display: flex; flex-direction: column; z-index: 1000; }
    .sidebar-header { padding: 15px; background: #212130; font-size: 0.9rem; font-weight: bold; color: #a4b0be; text-transform: uppercase; border-bottom: 1px solid #2d2d3f; }
    .feed-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

    /* Cards de Hidrantes */
    .card-hidrante { background: #212130; border-radius: 8px; border-left: 5px solid #2ed573; padding: 12px; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card-hidrante.alerta { border-left-color: #ff4757; background: #2c1a24; animation: pulse-border 1.5s infinite; }
    .card-hidrante.offline { border-left-color: #747d8c; opacity: 0.7; }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 1rem; }
    .card-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
    .status-ok { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
    .status-alerta { background: rgba(255, 71, 87, 0.2); color: #ff4757; }

    .card-info { font-size: 0.8rem; color: #ced6e0; display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }

    /* Área da Imagem */
    .card-media { position: relative; width: 100%; height: 180px; background: #000; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; }
    .card-media .no-image { color: #57606f; font-size: 0.8rem; font-style: italic; }

    /* Botão Solicitar HD */
    .btn-hd { margin-top: 10px; width: 100%; padding: 8px; background: #1e90ff; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-hd:hover { background: #3742fa; }

    /* Mapa */
    #map { flex: 1; height: 100%; background: #000; }

    /* Customização dos Marcadores do Leaflet */
    .leaflet-marker-icon-custom { border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

    /* Modal Foto Ampliada */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    .modal-content { max-width: 90%; max-height: 80%; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    .modal-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 30px; cursor: pointer; }
    .btn-download { margin-top: 15px; padding: 10px 20px; background: #2ed573; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .loading-spinner { color: #fff; font-size: 1.2rem; }
  </style>

  <!-- SDK Compatível do Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <header>
    <h1>🔴 Central de Monitoramento de Hidrantes</h1>
    <div class="status-bar" id="conexao-status">Conectando...</div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">Dispositivos Monitorados</div>
      <div class="feed-container" id="feed-hidrantes">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Modal Foto Full HD -->
  <div id="modal-foto" class="modal">
    <span class="modal-close" onclick="fecharModal()">&times;</span>
    <div id="modal-body" style="text-align: center;">
      <!-- Conteúdo inserido dinamicamente -->
    </div>
  </div>

  <script>
    // --- CONFIGURAÇÃO DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4", 
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- MONITOR DE CONEXÃO DA CENTRAL ---
    const conexaoRef = database.ref('.info/connected');
    conexaoRef.on('value', (snap) => {
      const statusEl = document.getElementById('conexao-status');
      if (snap.val() === true) {
        statusEl.innerText = "● SISTEMA ONLINE";
        statusEl.style.color = "#2ed573";
      } else {
        statusEl.innerText = "○ DESCONECTADO";
        statusEl.style.color = "#ff4757";
      }
    });

    // --- CONFIGURAÇÃO DO MAPA (LEAFLET) ---
    // Inicializado no centro de Juiz de Fora / Região Padrão
    const map = L.map('map').setView([-21.7642, -43.3503], 15);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Dicionário de marcadores do Leaflet para atualização dinâmica
    const marcadores = {};

    // Cadastro de Hidrantes com Geolocalização estática para o Mapa
    const cadastroHidrantes = {
      "HIDRANTE-001": {
        nome: "Hidrante 001 - Rua Principal",
        lat: -21.7642,
        lng: -43.3503
      }
    };

    // --- ÍCONES CUSTOMIZADOS DO MAPA ---
    const iconeVerde = L.divIcon({
      className: 'custom-div-icon',
      html: "<div style='background-color:#2ed573; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px #2ed573;'></div>",
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    const iconeVermelho = L.divIcon({
      className: 'custom-div-icon',
      html: "<div style='background-color:#ff4757; width:20px; height:20px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 12px #ff4757; animation: pulse-border 1s infinite;'></div>",
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    // --- ESCUTA O HISTÓRICO DE EVENTOS EM TEMPO REAL ---
    const historicoRef = database.ref('historico_hidrantes');

    historicoRef.on('value', (snapshot) => {
      const dadosCompletos = snapshot.val() || {};
      const containerFeed = document.getElementById('feed-hidrantes');
      containerFeed.innerHTML = '';

      // Garante a criação dos cards mesmo se o hidrante ainda não tiver eventos
      Object.keys(cadastroHidrantes).forEach(idHidrante => {
        const infoCadastral = cadastroHidrantes[idHidrante];
        const eventosDoHidrante = dadosCompletos[idHidrante] || {};

        // Transforma o objeto de eventos em Array e ordena pelo mais recente
        const chaves = Object.keys(eventosDoHidrante);
        let ultimoEvento = null;
        let chaveUltimoEvento = null;

        if (chaves.length > 0) {
          chaveUltimoEvento = chaves[chaves.length - 1];
          ultimoEvento = eventosDoHidrante[chaveUltimoEvento];
        }

        // Determina o estado (ALERTA ou NORMAL)
        const tsEvento = ultimoEvento ? (ultimoEvento.timestamp_servidor || ultimoEvento.timestamp || 0) : 0;
        const agora = Date.now();
        const ehAlertaRecente = ultimoEvento && ultimoEvento.evento === "ALERTA_MOVIMENTO" && (agora - tsEvento < 600000); // 10 minutos de retenção visual

        // Atualiza ou cria Marcador no Mapa
        if (!marcadores[idHidrante]) {
          marcadores[idHidrante] = L.marker([infoCadastral.lat, infoCadastral.lng], {
            icon: ehAlertaRecente ? iconeVermelho : iconeVerde
          }).addTo(map).bindPopup(`<b>${infoCadastral.nome}</b><br>ID: ${idHidrante}`);
        } else {
          marcadores[idHidrante].setIcon(ehAlertaRecente ? iconeVermelho : iconeVerde);
        }

        // Constrói o HTML do Card
        const card = document.createElement('div');
        card.className = `card-hidrante ${ehAlertaRecente ? 'alerta' : ''}`;
        
        const dataFormatada = tsEvento ? new Date(tsEvento).toLocaleString('pt-BR') : 'Sem registros';
        const bateria = ultimoEvento && ultimoEvento.bateria_volts ? `${ultimoEvento.bateria_volts}V` : 'N/A';
        const tipoEventoText = ultimoEvento ? ultimoEvento.evento : 'SEM EVENTO';

        let imagemHTML = `<div class="no-image">Nenhuma imagem capturada</div>`;
        if (ultimoEvento && ultimoEvento.thumb_base64) {
          imagemHTML = `<img src="${ultimoEvento.thumb_base64}" alt="Thumbnail Alerta" onclick="solicitarFotoFull('${idHidrante}', '${chaveUltimoEvento}')" style="cursor:pointer;" title="Clique para ampliar">`;
        }

        card.innerHTML = `
          <div class="card-title">
            <span>${infoCadastral.nome}</span>
            <span class="card-status ${ehAlertaRecente ? 'status-alerta' : 'status-ok'}">
              ${ehAlertaRecente ? '🚨 VIOLAÇÃO' : 'OK'}
            </span>
          </div>
          <div class="card-info">
            <span><b>Último Evento:</b> ${tipoEventoText}</span>
            <span><b>Data/Hora:</b> ${dataFormatada}</span>
            <span><b>Bateria:</b> 🔋 ${bateria}</span>
          </div>
          <div class="card-media">
            ${imagemHTML}
          </div>
          ${ultimoEvento ? `
            <button class="btn-hd" onclick="solicitarFotoFull('${idHidrante}', '${chaveUltimoEvento}', event)">
              📷 Solicitar Foto HD
            </button>
          ` : ''}
        `;

        containerFeed.appendChild(card);
      });
    });

    // --- REQUISIÇÃO E EXIBIÇÃO DA FOTO HD ---
    window.solicitarFotoFull = function(idHidrante, chavePush, event) {
      if (event) event.stopPropagation();

      const modal = document.getElementById('modal-foto');
      const modalBody = document.getElementById('modal-body');
      
      modalBody.innerHTML = `
        <div class="loading-spinner">
          📡 Solicitando foto em alta resolução à Câmera...<br>
          <small style="font-size:0.8rem; color:#aaa;">Aguarde a transmissão em tempo real...</small>
        </div>`;
      modal.style.display = 'flex';

      // 1. Grava no nó de solicitações
      const reqRef = database.ref('solicitacoes_foto').push();
      reqRef.set({
        id_hidrante: idHidrante,
        evento_id: chavePush,
        timestamp: Date.now(),
        atendido: false
      });

      // 2. Escuta no nó exato do evento a chegada da foto_full
      const eventoRef = database.ref(`historico_hidrantes/${idHidrante}/${chavePush}/foto_full`);
      
      const listener = eventoRef.on('value', (snapshot) => {
        const fotoFullUrlOuBase64 = snapshot.val();
        if (fotoFullUrlOuBase64) {
          const nomeArquivo = `HIDRANTE_${idHidrante}_${chavePush}.jpg`;
          modalBody.innerHTML = `
            <img src="${fotoFullUrlOuBase64}" class="modal-content" alt="Foto Ampliada HD">
            <br>
            <a href="${fotoFullUrlOuBase64}" download="${nomeArquivo}" class="btn-download">
              💾 Baixar Foto em Alta Resolução
            </a>
          `;
          eventoRef.off('value', listener);
        }
      });
    };

    window.fecharModal = function() {
      document.getElementById('modal-foto').style.display = 'none';
    };
  </script>
</body>
</html>
