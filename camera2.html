<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câmera Hidrante - Captura & HD</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
    video { width: 100%; max-height: 300px; background: #000; border-radius: 8px; }
    #logBox { background: #000; color: #00ff00; padding: 10px; font-family: monospace; font-size: 11px; height: 180px; overflow-y: auto; border-radius: 6px; margin-top: 10px; border: 1px solid #333; }
    .ok { color: #00ff00; } .err { color: #ff5555; } .warn { color: #ffcc00; }
  </style>

  <!-- SDK Compatível do Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h3>Câmera do Hidrante (Visão em Tempo Real)</h3>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvasHD" style="display:none;"></canvas>

  <h4>Logs do Sistema:</h4>
  <div id="logBox"></div>

  <script>
    // --- FUNÇÃO DE LOG NA TELA ---
    function log(mensagem, tipo = 'normal') {
      const logBox = document.getElementById('logBox');
      const p = document.createElement('div');
      p.className = tipo;
      p.innerText = `[${new Date().toLocaleTimeString()}] ${mensagem}`;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // --- VARIÁVEIS GLOBAIS ---
    let fotoHDSalvaNaMemoria = null;
    let ultimoCaminhoEvento = null;
    let ultimoEventoProcessado = null;

    // --- CONFIGURAÇÃO DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4", 
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- MONITOR DE CONEXÃO DO FIREBASE ---
    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        log("🟢 Firebase Conectado em Tempo Real!", "ok");
      } else {
        log("🔴 Firebase Desconectado! Tentando reconectar...", "err");
      }
    });

    // --- INICIALIZAÇÃO DA CÂMERA (Sem travar o JS) ---
    async function iniciarCamera() {
      const video = document.getElementById('video');
      log("Iniciando acesso à câmera...", "warn");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        log("📷 Câmera traseira ativada com sucesso!", "ok");
      } catch (err) {
        log("⚠️ Falha na câmera traseira. Tentando câmera genérica...", "err");
        try {
          const streamGenerico = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = streamGenerico;
          await video.play();
          log("📷 Câmera padrão ativada!", "ok");
        } catch (errGeral) {
          log("❌ Erro fatal de hardware na câmera: " + errGeral.message, "err");
        }
      }
    }

    // --- ESCUTA DE ALERTAS DO ESP32 (Gera Thumbnail) ---
    function escutarAlertasESP() {
      const historicoRef = db.ref('historico_hidrantes');

      historicoRef.limitToLast(1).on('child_added', async (snapshot) => {
        const eventoObj = snapshot.val();
        const chavePush = snapshot.key;

        if (!eventoObj) return;

        const tsEvento = eventoObj.timestamp || eventoObj.timestamp_servidor || 0;
        const agora = Date.now();

        // Detecta evento recente (<30s)
        if (eventoObj.evento === "ALERTA_MOVIMENTO" && (agora - tsEvento < 30000)) {
          if (ultimoEventoProcessado === chavePush) return;
          ultimoEventoProcessado = chavePush;

          log("📸 ALERTA DO ESP32 DETECTADO! Registrando cena...", "warn");
          ultimoCaminhoEvento = `historico_hidrantes/${chavePush}`;

          const video = document.getElementById('video');
          const canvas = document.getElementById('canvasHD');
          const ctx = canvas.getContext('2d');

          // 1. Foto HD para RAM
          canvas.width = 1280;
          canvas.height = 720;
          ctx.drawImage(video, 0, 0, 1280, 720);
          fotoHDSalvaNaMemoria = canvas.toDataURL('image/jpeg', 0.8);

          // 2. Thumbnail leve para o Firebase (320x240)
          canvas.width = 320;
          canvas.height = 240;
          ctx.drawImage(video, 0, 0, 320, 240);
          const thumbBase64 = canvas.toDataURL('image/jpeg', 0.5);

          // Salva no Firebase
          try {
            await db.ref(ultimoCaminhoEvento).update({ thumb_base64: thumbBase64 });
            log("✅ Thumbnail salva no Firebase!", "ok");
          } catch (e) {
            log("Erro ao gravar Thumbnail: " + e.message, "err");
          }
        }
      });
    }

    // --- ESCUTA DE SOLICITAÇÕES HD DA CENTRAL ---
    function escutarSolicitacoesHD() {
      const solicitacoesRef = db.ref('solicitacoes_foto');

      solicitacoesRef.on('child_added', async (snapshot) => {
        const pedido = snapshot.val();
        const key = snapshot.key;

        if (pedido && !pedido.atendido) {
          log("⚡ Solicitação de foto HD recebida da Central!", "warn");

          const eventoId = pedido.evento_id;
          let caminhoFinal = eventoId ? `historico_hidrantes/${eventoId}` : ultimoCaminhoEvento;

          if (!caminhoFinal) {
            log("⚠️ Caminho do evento não localizado para anexar foto HD.", "err");
            return;
          }

          try {
            let fotoParaEnviar = fotoHDSalvaNaMemoria;

            // Se não estava em RAM, faz captura ao vivo
            if (!fotoParaEnviar) {
              const video = document.getElementById('video');
              const canvas = document.getElementById('canvasHD');
              canvas.width = 1280;
              canvas.height = 720;
              canvas.getContext('2d').drawImage(video, 0, 0, 1280, 720);
              fotoParaEnviar = canvas.toDataURL('image/jpeg', 0.8);
            }

            // Anexa a Foto Full no evento
            await db.ref(caminhoFinal).update({ foto_full: fotoParaEnviar });
            // Marca solicitação como concluída
            await db.ref(`solicitacoes_foto/${key}`).update({ atendido: true });

            log("🚀 Foto HD enviada com sucesso para a Central!", "ok");
          } catch (err) {
            log("Erro no envio da Foto HD: " + err.message, "err");
          }
        }
      });
    }

    // --- INICIALIZAÇÃO GERAL ---
    window.addEventListener('DOMContentLoaded', () => {
      iniciarCamera();
      escutarAlertasESP();
      escutarSolicitacoesHD();
    });
  </script>
</body>
</html>
