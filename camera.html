<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câmera de Monitoramento - Tampa Hidrante</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header { text-align: center; width: 100%; margin-bottom: 8px; }
    h1 { font-size: 1.1rem; color: #38bdf8; }
    .hidrante-badge {
      display: inline-block;
      margin-top: 2px;
      padding: 2px 8px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .video-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #logBox {
      width: 100%;
      max-width: 360px;
      height: 220px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 10px;
      padding: 8px;
      font-size: 0.75rem;
      overflow-y: auto;
      color: #38bdf8;
    }
    .log-err { color: #f87171; }
    .log-ok { color: #4ade80; }
    .log-warn { color: #fbbf24; }

    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Câmera Autônoma</h1>
    <div class="hidrante-badge" id="hidranteLabel">HIDRANTE-001</div>
  </header>

  <main class="video-container">
    <video id="video" autoplay playsinline muted></video>
  </main>

  <div id="logBox">⚡ Inicializando sistema de escuta...<br></div>

  <canvas id="canvasThumb"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4",
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const video = document.getElementById('video');
    const canvasThumb = document.getElementById('canvasThumb');
    const logBox = document.getElementById('logBox');

    function log(msg, tipo = '') {
      const hora = new Date().toLocaleTimeString();
      let classe = '';
      if (tipo === 'ok') classe = 'log-ok';
      if (tipo === 'err') classe = 'log-err';
      if (tipo === 'warn') classe = 'log-warn';
      logBox.innerHTML += `<div class="${classe}">[${hora}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false });
        video.srcObject = stream;
        log("Câmera traseira ativada!", "ok");
      } catch (err) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = stream;
          log("Câmera padrão ativada!", "ok");
        } catch (e) {
          log("Erro de câmera: " + e.message, "err");
        }
      }
    }

    function monitorarTudo() {
      log("Escutando historico_hidrantes...");
      
      const rootRef = ref(db, 'historico_hidrantes');

      onValue(rootRef, (snapshot) => {
        const dados = snapshot.val();
        if (!dados) {
          log("Nenhum registro encontrado em /historico_hidrantes", "warn");
          return;
        }

        log("Chaves encontradas no banco: " + Object.keys(dados).join(", "), "warn");

        // Procura por qualquer variação do nome do hidrante
        let hidranteKey = Object.keys(dados).find(k => k.toUpperCase().includes("HIDRANTE"));
        if (!hidranteKey) hidranteKey = Object.keys(dados)[0];

        if (hidranteKey) {
          const eventos = dados[hidranteKey];
          const keysEventos = Object.keys(eventos);
          const ultimaChaveEvento = keysEventos[keysEventos.length - 1];
          const ultimoEvento = eventos[ultimaChaveEvento];

          log(`Último evento em [${hidranteKey}]: ${ultimoEvento.evento}`, "ok");

          if (ultimoEvento.evento === 'ALERTA_MOVIMENTO' && !ultimoEvento.thumb_base64) {
            log("🎯 ALERTA DETECTADO SEM FOTO! Capturando...", "ok");
            capturarEAnexarFoto(hidranteKey, ultimaChaveEvento);
          }
        }
      });
    }

    async function capturarEAnexarFoto(hidranteKey, eventKey) {
      if (!video.videoWidth) {
        log("Aguardando inicialização do vídeo...", "err");
        return;
      }

      const ctxThumb = canvasThumb.getContext('2d');
      const thumbWidth = 160;
      const thumbHeight = (video.videoHeight / video.videoWidth) * thumbWidth;
      canvasThumb.width = thumbWidth;
      canvasThumb.height = thumbHeight;
      ctxThumb.drawImage(video, 0, 0, thumbWidth, thumbHeight);
      
      const thumbBase64 = canvasThumb.toDataURL('image/jpeg', 0.5);

      try {
        log("Enviando foto ao Firebase...", "warn");
        await update(ref(db, `historico_hidrantes/${hidranteKey}/${eventKey}`), {
          thumb_base64: thumbBase64
        });
        log("✅ FOTO REGISTRADA COM SUCESSO!", "ok");
      } catch (err) {
        log("Erro ao salvar foto: " + err.message, "err");
      }
    }

    initCamera();
    monitorarTudo();
  </script>
</body>
</html>
