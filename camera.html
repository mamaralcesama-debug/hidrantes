<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "uS8i8Q1dBAPRIsTzVJNjh628sFKoJc9vksohMvU4",
    databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
    projectId: "tampashidrantes"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const video = document.getElementById('video');
  const canvasThumb = document.getElementById('canvasThumb');
  const logBox = document.getElementById('logBox');

  // Canvas auxiliar para foto HD em background
  const canvasHD = document.createElement('canvas');

  let ultimoCaminhoEvento = null;

  function log(msg, tipo = '') {
    const hora = new Date().toLocaleTimeString();
    let classe = '';
    if (tipo === 'ok') classe = 'log-ok';
    if (tipo === 'err') classe = 'log-err';
    if (tipo === 'warn') classe = 'log-warn';
    logBox.innerHTML += `<div class="${classe}">[${hora}] ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { exact: "environment" } }, 
        audio: false 
      });
      video.srcObject = stream;
      log("Câmera traseira ativada!", "ok");
    } catch (err) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        log("Câmera padrão ativada!", "ok");
      } catch (e) {
        log("Erro de câmera: " + e.message, "err");
      }
    }
  }

  // --- Função para salvar foto HD no Disco Local (OPFS) e baixar na Galeria ---
  async function salvarFotoNoDiscoEGaleria(fotoBase64, idEvento) {
    try {
      // 1. Salva na pasta privada permanente do navegador (OPFS - Disco do celular)
      const root = await navigator.storage.getDirectory();
      const fileHandle = await root.getFileHandle(`${idEvento}.jpg`, { create: true });
      const writable = await fileHandle.createWritable();
      
      // Converte Base64 para Blob
      const res = await fetch(fotoBase64);
      const blob = await res.blob();
      
      await writable.write(blob);
      await writable.close();
      log("📁 Foto HD gravada no disco rígido do dispositivo!", "ok");

      // 2. Dispara o download para que a foto vá para a Galeria/Downloads
      const linkDownload = document.createElement('a');
      linkDownload.href = fotoBase64;
      linkDownload.download = `HIDRANTE_${idEvento}.jpg`;
      document.body.appendChild(linkDownload);
      linkDownload.click();
      document.body.removeChild(linkDownload);
      log("🖼️ Imagem enviada para a Galeria/Downloads do celular!", "ok");

    } catch (err) {
      log("Aviso no salvamento em disco: " + err.message, "warn");
    }
  }

  // --- Processo de disparo quando ocorre o ALERTA ---
  async function capturarEAnexarFoto(caminhoCompleto, idEvento) {
    if (!video.videoWidth) {
      log("Aguardando inicialização da câmera...", "err");
      return;
    }

    log("📸 Capturando imagem do evento...", "warn");

    // 1. Captura HD (1280px com 80% de qualidade)
    const maxLargura = 1280;
    const escala = Math.min(1, maxLargura / video.videoWidth);
    const hdWidth = video.videoWidth * escala;
    const hdHeight = video.videoHeight * escala;

    canvasHD.width = hdWidth;
    canvasHD.height = hdHeight;
    const ctxHD = canvasHD.getContext('2d');
    ctxHD.drawImage(video, 0, 0, hdWidth, hdHeight);
    const fotoHDBase64 = canvasHD.toDataURL('image/jpeg', 0.8);

    // Salva localmente no disco e na Galeria
    salvarFotoNoDiscoEGaleria(fotoHDBase64, idEvento);

    // 2. Captura Thumbnail (160px para envio leve e rápido)
    const thumbWidth = 160;
    const thumbHeight = (video.videoHeight / video.videoWidth) * thumbWidth;
    canvasThumb.width = thumbWidth;
    canvasThumb.height = thumbHeight;
    const ctxThumb = canvasThumb.getContext('2d');
    ctxThumb.drawImage(video, 0, 0, thumbWidth, thumbHeight);
    const thumbBase64 = canvasThumb.toDataURL('image/jpeg', 0.5);

    // 3. Sobe apenas a Thumbnail para o Firebase
    try {
      log("Enviando Thumbnail para o Firebase...", "warn");
      await update(ref(db, caminhoCompleto), {
        thumb_base64: thumbBase64
      });
      log("✅ Thumbnail enviada com sucesso!", "ok");
    } catch (err) {
      log("Erro ao salvar thumbnail: " + err.message, "err");
    }
  }

  // --- Escuta de solicitações do Dashboard/Index ---
  function escutarSolicitacoesHD() {
    const solicitacoesRef = ref(db, 'solicitacoes_foto');

    onValue(solicitacoesRef, async (snapshot) => {
      const dados = snapshot.val();
      if (!dados) return;

      const keys = Object.keys(dados);
      const ultimaKey = keys[keys.length - 1];
      const pedido = dados[ultimaKey];

      if (pedido && !pedido.atendido && ultimoCaminhoEvento) {
        log("⚡ Solicitacao de foto HD recebida da central!", "warn");

        try {
          // Busca o arquivo do disco rígido local do celular (OPFS)
          const root = await navigator.storage.getDirectory();
          const partesCaminho = ultimoCaminhoEvento.split('/');
          const idEvento = partesCaminho[partesCaminho.length - 1];

          const fileHandle = await root.getFileHandle(`${idEvento}.jpg`);
          const file = await fileHandle.getFile();
          
          // Leitura do arquivo em Base64
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onloadend = async () => {
            const base64HD = reader.result;

            // Faz o upload da imagem HD salva no disco para o Firebase
            await update(ref(db, ultimoCaminhoEvento), {
              foto_full: base64HD
            });

            await update(ref(db, `solicitacoes_foto/${ultimaKey}`), {
              atendido: true
            });

            log("🚀 Foto HD salva no disco enviada para a central!", "ok");
          };
        } catch (err) {
          log("Erro ao ler foto salva no disco: " + err.message, "err");
        }
      }
    });
  }

  // Escuta os alertas do Firebase
  function escutarFirebaseGeral() {
    const rootRef = ref(db);

    onValue(rootRef, (snapshot) => {
      const bancoCompleto = snapshot.val();
      if (!bancoCompleto) return;

      let pastaHidrante = null;
      let caminhoBase = "";

      if (bancoCompleto.historico_hidrantes) {
        pastaHidrante = bancoCompleto.historico_hidrantes;
        caminhoBase = "historico_hidrantes";
      } else {
        for (let key in bancoCompleto) {
          if (key.includes("historico_hidrantes") || key.includes("HIDRANTE")) {
            pastaHidrante = bancoCompleto[key];
            caminhoBase = key;
            break;
          }
        }
      }

      if (!pastaHidrante) return;

      let subChave = Object.keys(pastaHidrante).find(k => k.includes("HIDRANTE"));
      let eventos = subChave ? pastaHidrante[subChave] : pastaHidrante;

      if (eventos && typeof eventos === 'object') {
        const chavesEventos = Object.keys(eventos);
        const ultimaChave = chavesEventos[chavesEventos.length - 1];
        const ultimoEvento = eventos[ultimaChave];

        if (ultimoEvento && typeof ultimoEvento === 'object') {
          if (ultimoEvento.evento === 'ALERTA_MOVIMENTO' && !ultimoEvento.thumb_base64) {
            
            ultimoCaminhoEvento = subChave 
              ? `${caminhoBase}/${subChave}/${ultimaChave}` 
              : `${caminhoBase}/${ultimaChave}`;
              
            capturarEAnexarFoto(ultimoCaminhoEvento, ultimaChave);
          }
        }
      }
    });
  }

  initCamera();
  escutarFirebaseGeral();
  escutarSolicitacoesHD();
</script>
