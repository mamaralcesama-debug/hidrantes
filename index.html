<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Monitoramento de Hidrantes</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #1a252f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
    
    .main-container { display: flex; flex: 1; overflow: hidden; }
    
    /* Container do Mapa */
    #map { flex: 1.8; height: 100%; border-right: 2px solid #ddd; }
    
    /* Painel Lateral */
    .sidebar { flex: 1.2; display: flex; flex-direction: column; background: white; padding: 20px; overflow: hidden; }
    
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    .filter-bar h2 { font-size: 1.05rem; color: #2c3e50; }
    .filter-bar select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85rem; outline: none; }
    
    /* Tabela com Scroll */
    .table-wrapper { flex: 1; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { position: sticky; top: 0; background-color: #f8f9fa; color: #4a5568; font-weight: 600; text-align: left; padding: 10px 8px; border-bottom: 2px solid #e2e8f0; z-index: 10; }
    td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
    
    /* Badges de Status */
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; display: inline-block; white-space: nowrap; }
    .badge-verde { background-color: #2ecc71; }
    .badge-vermelho { background-color: #e74c3c; animation: pulse 1s infinite; }
    .badge-laranja { background-color: #e67e22; }
    .badge-cinza { background-color: #7f8c8d; }
    
    /* Botão Dentro do Popup do Leaflet */
    .btn-reconhecer {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-reconhecer:hover { background-color: #c0392b; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚨 Monitoramento & Histórico em Tempo Real</h1>
    <div id="status-conexao">Conectando ao Firebase...</div>
  </header>

  <div class="main-container">
    <div id="map"></div>

    <div class="sidebar">
      <div class="filter-bar">
        <h2>📋 Histórico de Eventos</h2>
        <div>
          <label for="filtro-hidrante" style="font-size:0.8rem; font-weight:bold; margin-right:4px;">Filtrar:</label>
          <select id="filtro-hidrante" onchange="renderizarTabelaEAtualizarMapa()">
            <option value="TODOS">-- Todos os Hidrantes --</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data / Hora</th>
              <th>Hidrante</th>
              <th>Evento</th>
              <th>Bateria</th>
            </tr>
          </thead>
          <tbody id="tabela-historico"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Leaflet & Firebase SDKs -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. CADASTRO FIXO DOS HIDRANTES
    const CADASTRO_HIDRANTES = {
      "HIDRANTE-001": { nome: "Hidrante Bloco A (Entrada)", lat: -21.7642, lng: -43.3503 },
      "HIDRANTE-002": { nome: "Hidrante Bloco B (Garagem)", lat: -21.7650, lng: -43.3510 },
      "HIDRANTE-003": { nome: "Hidrante Reservatório Central", lat: -21.7635, lng: -43.3495 }
    };

    // 2. CONFIGURAÇÃO DO FIREBASE
    const firebaseConfig = {
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 3. INICIALIZAÇÃO DO MAPA
    const map = L.map('map').setView([-21.7642, -43.3503], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

    const marcadoresMapa = {};
    const audioAlerta = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    const criarIcone = (cor) => new L.Icon({
      iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${cor}.png`,
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const iconeVerde = criarIcone('green');
    const iconeVermelho = criarIcone('red');
    const iconeLaranja = criarIcone('orange');
    const iconeCinza = criarIcone('grey');

    const selectFiltro = document.getElementById('filtro-hidrante');
    Object.keys(CADASTRO_HIDRANTES).forEach(id => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      selectFiltro.appendChild(opt);

      const info = CADASTRO_HIDRANTES[id];
      const marker = L.marker([info.lat, info.lng], { icon: iconeCinza }).addTo(map);
      
      marker.on('click', () => {
        selectFiltro.value = id;
        renderizarTabelaEAtualizarMapa();
      });

      marker.bindPopup(`<b>${id}</b><br>${info.nome}<br>Aguardando dados...`);
      marcadoresMapa[id] = marker;
    });

    // 4. FUNÇÕES DE SUPORTE
    
    // Converte Volts em Porcentagem (3.6V = 0% | 4.2V = 100%)
    function converterVoltsParaPorcentagem(volts) {
      if (!volts || volts <= 0) return 0;
      let pct = Math.round(((volts - 3.6) / (4.2 - 3.6)) * 100);
      if (pct > 100) pct = 100;
      if (pct < 0) pct = 0;
      return pct;
    }

    // Função invocada ao clicar no botão dentro do Popup
    window.reconhecerAlertaNoMapa = function(idHidrante) {
      const timestampAtual = Date.now();
      
      database.ref(`status_operacional/${idHidrante}`).set({
        alerta_reconhecido: true,
        timestamp_reconhecimento: timestampAtual
      }).then(() => {
        // Força a re-renderização para atualizar a cor do ícone no mapa
        renderizarTabelaEAtualizarMapa();
      }).catch(err => {
        console.error("Erro ao reconhecer alerta:", err);
      });
    };

    // 5. PROCESSAMENTO E SINCRONIZAÇÃO
    let historicoBruto = {};
    let statusOperacionalBruto = {};

    function renderizarTabelaEAtualizarMapa() {
      const filtroAtual = selectFiltro.value;
      const tabelaBody = document.getElementById('tabela-historico');
      tabelaBody.innerHTML = '';

      const agora = Date.now();
      const LIMITE_24H_MS = 24 * 60 * 60 * 1000;

      let listaEventosCompleta = [];
      let ultimosEventosPorHidrante = {};

      // A) Varre o histórico e pega o evento mais recente de cada hidrante
      Object.keys(historicoBruto).forEach(idHidrante => {
        const registros = historicoBruto[idHidrante];
        if (!registros) return;

        Object.keys(registros).forEach(chavePush => {
          const eventoObj = registros[chavePush];
          const item = {
            idHidrante: idHidrante,
            evento: eventoObj.evento || "HEARTBEAT",
            bateria_volts: eventoObj.bateria_volts || 0,
            timestamp: eventoObj.timestamp_servidor || 0
          };

          listaEventosCompleta.push(item);

          if (!ultimosEventosPorHidrante[idHidrante] || item.timestamp > ultimosEventosPorHidrante[idHidrante].timestamp) {
            ultimosEventosPorHidrante[idHidrante] = item;
          }
        });
      });

      // Ordena a tabela em ordem cronológica decrescente
      listaEventosCompleta.sort((a, b) => b.timestamp - a.timestamp);

      // B) Renderiza a Tabela
      listaEventosCompleta.forEach(item => {
        if (filtroAtual !== "TODOS" && item.idHidrante !== filtroAtual) return;

        const dataFormatada = item.timestamp ? new Date(item.timestamp).toLocaleString('pt-BR') : "--";
        const bateriaPct = converterVoltsParaPorcentagem(item.bateria_volts);
        
        let classBadge = "badge-verde";
        let textoStatus = "NORMAL";

        if (item.evento === "ALERTA_MOVIMENTO") {
          classBadge = "badge-vermelho";
          textoStatus = "MOVIMENTO";
        } else if (bateriaPct < 30) {
          classBadge = "badge-laranja";
          textoStatus = "BATERIA BAIXA";
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${dataFormatada}</td>
          <td><b>${item.idHidrante}</b></td>
          <td><span class="badge ${classBadge}">${textoStatus}</span></td>
          <td><b>${bateriaPct}%</b> (${item.bateria_volts.toFixed(2)}V)</td>
        `;
        tabelaBody.appendChild(tr);
      });

      // C) Lógica de Estado do Mapa
      Object.keys(CADASTRO_HIDRANTES).forEach(idHidrante => {
        const cadastro = CADASTRO_HIDRANTES[idHidrante];
        const ultimoEvento = ultimosEventosPorHidrante[idHidrante];
        const opStatus = statusOperacionalBruto[idHidrante] || {};
        
        let iconeParaUsar = iconeCinza;
        let statusMapaTexto = "OFFLINE (>24h sem sinal)";
        let dataFormatadaMapa = "Nunca";
        let bateriaPctMapa = 0;
        let exibirBotaoLimpar = false;

        if (ultimoEvento) {
          const tempoDecorrido = agora - ultimoEvento.timestamp;
          dataFormatadaMapa = new Date(ultimoEvento.timestamp).toLocaleString('pt-BR');
          bateriaPctMapa = converterVoltsParaPorcentagem(ultimoEvento.bateria_volts);

          // Verifica se o último alerta de movimento foi registrado DEPOIS do último clique de reconhecimento
          const tsReconhecimento = opStatus.timestamp_reconhecimento || 0;
          const foiReconhecido = opStatus.alerta_reconhecido && (tsReconhecimento > ultimoEvento.timestamp);

          if (tempoDecorrido > LIMITE_24H_MS) {
            statusMapaTexto = "OFFLINE (>24h)";
            iconeParaUsar = iconeCinza;
          } else if (ultimoEvento.evento === "ALERTA_MOVIMENTO" && !foiReconhecido) {
            // ALERTA ATIVO E NÃO RECONHECIDO -> VERMELHO
            statusMapaTexto = "<b style='color:#e74c3c;'>🚨 ALERTA DE MOVIMENTO</b>";
            iconeParaUsar = iconeVermelho;
            exibirBotaoLimpar = true;
          } else if (bateriaPctMapa < 30) {
            // BATERIA BAIXA -> LARANJA
            statusMapaTexto = "<b style='color:#e67e22;'>⚠️ BATERIA BAIXA</b>";
            iconeParaUsar = iconeLaranja;
          } else {
            // NORMAL -> VERDE
            statusMapaTexto = "<b style='color:#2ecc71;'>NORMAL</b>";
            iconeParaUsar = iconeVerde;
          }
        }

        if (marcadoresMapa[idHidrante]) {
          const marker = marcadoresMapa[idHidrante];
          marker.setIcon(iconeParaUsar);
          
          let htmlPopup = `
            <div style="min-width: 180px;">
              <h3 style="margin-bottom:5px; font-size:1rem;">${idHidrante}</h3>
              <p style="font-size:0.85rem; color:#555; margin-bottom:8px;">${cadastro.nome}</p>
              <hr style="margin-bottom:8px; border:0; border-top:1px solid #eee;">
              <b>Status:</b> ${statusMapaTexto}<br>
              <b>Último Sinal:</b> ${dataFormatadaMapa}<br>
              <b>Bateria:</b> ${bateriaPctMapa}%
          `;

          if (exibirBotaoLimpar) {
            htmlPopup += `
              <button class="btn-reconhecer" onclick="reconhecerAlertaNoMapa('${idHidrante}')">
                ✔ Reconhecer Alerta
              </button>
            `;
          }

          htmlPopup += `</div>`;

          marker.setPopupContent(htmlPopup);
        }
      });
    }

    // 6. OBSERVADORES DO FIREBASE EM TEMPO REAL
    database.ref('status_operacional').on('value', (snapshot) => {
      statusOperacionalBruto = snapshot.val() || {};
      renderizarTabelaEAtualizarMapa();
    });

    database.ref('historico_hidrantes').on('value', (snapshot) => {
      document.getElementById('status-conexao').innerHTML = '🟢 Conectado em Tempo Real';
      historicoBruto = snapshot.val() || {};
      renderizarTabelaEAtualizarMapa();
    });
  </script>
</body>
</html>
