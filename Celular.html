<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Câmera Hidrante (Modo Estável)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header { text-align: center; width: 100%; margin-bottom: 8px; }
    h1 { font-size: 1.1rem; color: #38bdf8; }
    .hidrante-badge {
      display: inline-block;
      padding: 2px 8px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .video-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 4 / 3;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #logBox {
      width: 100%;
      max-width: 360px;
      height: 200px;
      background-color: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 10px;
      padding: 8px;
      font-size: 0.75rem;
      overflow-y: auto;
      color: #38bdf8;
    }
    .log-err { color: #f87171; font-weight: bold; }
    .log-ok { color: #4ade80; }
    .log-warn { color: #fbbf24; }

    /* Tela de erro cobrindo tudo se houver falha crítica */
    #criticalError {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      color: #f87171;
      padding: 40px;
      text-align: center;
      z-index: 1000;
      font-weight: bold;
      font-size: 1.2rem;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <!-- Tela de erro crítico -->
  <div id="criticalError">
    🔴 Erro Crítico!<br>A página não pôde carregar.<br><br>
    <span id="errorDesc" style="font-size: 0.9rem; color: #94a3b8;">Verifique a câmera e se está usando HTTPS.</span>
  </div>

  <header>
    <h1>Câmera Hidrante</h1>
    <div class="hidrante-badge" id="hidranteLabel">HIDRANTE-001</div>
  </header>

  <main class="video-container">
    <video id="video" autoplay playsinline muted></video>
  </main>

  <div id="logBox">⚡ Aguardando inicialização...<br></div>

  <!-- Canvas auxiliar para manipulação de imagem -->
  <canvas id="canvasThumb"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração oficial do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA7ZYlYhj-3_7dvYxKccMiKNRdWTnSDb5M",
      authDomain: "tampashidrantes.firebaseapp.com",
      databaseURL: "https://tampashidrantes-default-rtdb.firebaseio.com",
      projectId: "tampashidrantes",
      storageBucket: "tampashidrantes.firebasestorage.app",
      messagingSenderId: "574663080419",
      appId: "1:574663080419:web:1a1c5fb1f032a2d5e008d6",
      measurementId: "G-PCDJBGGMKS"
    };

    // --- Tratamento de erro crítico ---
    function showCriticalError(msg) {
      document.getElementById('criticalError').style.display = 'block';
      document.getElementById('errorDesc').textContent = msg;
    }

    // Canvas auxiliar para foto HD em background
    const canvasHD = document.createElement('canvas');
    let fotoHDSalvaNaMemoria = null; // Versão segura: mantém na memória RAM
    let ultimoCaminhoEvento = null;

    // Inicializa Firebase com tratamento de erro
    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      showCriticalError("Erro ao conectar ao Firebase: " + e.message);
    }

    const video = document.getElementById('video');
    const canvasThumb = document.getElementById('canvasThumb');
    const logBox = document.getElementById('logBox');

    function log(msg, tipo = '') {
      const hora = new Date().toLocaleTimeString();
      let classe = '';
      if (tipo === 'ok') classe = 'log-ok';
      if (tipo === 'err') classe = 'log-err';
      if (tipo === 'warn') classe = 'log-warn';
      logBox.innerHTML += `<div class="${classe}">[${hora}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // --- Monitor de Conexão com o Firebase ---
    function monitorarConexaoFirebase() {
      const connectedRef = ref(db, ".info/connected");
      onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
          log("🟢 Firebase Conectado!", "ok");
        } else {
          log("🔴 Firebase Desconectado! Aguardando rede...", "err");
        }
      });
    }

    // Inicializa Câmera
    async function initCamera() {
      try {
        log("Tentando acessar câmera traseira...");
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: { exact: "environment" } }, 
          audio: false 
        });
        video.srcObject = stream;
        log("Câmera traseira ativada!", "ok");
      } catch (err) {
        log("Câmera traseira não encontrada, tentando câmera padrão...", "warn");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = stream;
          log("Câmera padrão ativada!", "ok");
        } catch (e) {
          log("ERRO DE CÂMERA: " + e.message, "err");
          showCriticalError("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
        }
      }
    }

    // --- Processo de disparo quando ocorre o ALERTA ---
    async function capturarECongelarCena(caminhoCompleto, idEvento) {
      if (!video.videoWidth) {
        log("Erro: Câmera não pronta para captura.", "err");
        return;
      }

      log("📸 ALERTA! Registrando cena...", "warn");

      // 1. Captura HD (1280px com 80% de qualidade)
      const maxLargura = 1280;
      const escala = Math.min(1, maxLargura / video.videoWidth);
      const hdWidth = video.videoWidth * escala;
      const hdHeight = video.videoHeight * escala;

      canvasHD.width = hdWidth;
      canvasHD.height = hdHeight;
      const ctxHD = canvasHD.getContext('2d');
      ctxHD.drawImage(video, 0, 0, hdWidth, hdHeight);
      
      // Salva a versão HD na memória RAM temporária do celular
      fotoHDSalvaNaMemoria = canvasHD.toDataURL('image/jpeg', 0.8);
      log("📁 Foto HD congelada na memória do aparelho.", "ok");

      // 2. Captura Thumbnail (160px para envio leve e rápido)
      const thumbWidth = 160;
      const thumbHeight = (video.videoHeight / video.videoWidth) * thumbWidth;
      canvasThumb.width = thumbWidth;
      canvasThumb.height = thumbHeight;
      const ctxThumb = canvasThumb.getContext('2d');
      ctxThumb.drawImage(video, 0, 0, thumbWidth, thumbHeight);
      const thumbBase64 = canvasThumb.toDataURL('image/jpeg', 0.5);

      // 3. Sobe apenas a Thumbnail para o Firebase
      try {
        log("Enviando Thumbnail rápida...", "warn");
        await update(ref(db, caminhoCompleto), {
          thumb_base64: thumbBase64
        });
        log("✅ Thumbnail enviada com sucesso!", "ok");
      } catch (err) {
        log("Erro ao salvar thumbnail: " + err.message, "err");
      }
    }

    // --- Escuta de solicitações da Central ---
    function escutarSolicitacoesHD() {
      const solicitacoesRef = ref(db, 'solicitacoes_foto');

      onValue(solicitacoesRef, async (snapshot) => {
        const dados = snapshot.val();
        if (!dados) return;

        const keys = Object.keys(dados);
        const ultimaKey = keys[keys.length - 1];
        const pedido = dados[ultimaKey];

        // Se houver solicitação não atendida e foto na memória
        if (pedido && !pedido.atendido && ultimoCaminhoEvento && fotoHDSalvaNaMemoria) {
          log("⚡ Solicitação de foto HD recebida da central!", "warn");

          try {
            log("🚀 Enviando foto HD congelada para a central...", "warn");
            
            // Upload da imagem HD salva na memória RAM para o Firebase
            await update(ref(db, ultimoCaminhoEvento), {
              foto_full: fotoHDSalvaNaMemoria
            });

            // Marca o pedido como atendido
            await update(ref(db, `solicitacoes_foto/${ultimaKey}`), {
              atendido: true
            });

            log("✅ Foto HD da cena enviada com sucesso!", "ok");
          } catch (err) {
            log("Erro ao subir foto HD: " + err.message, "err");
          }
        }
      });
    }

    // --- Escuta os alertas do Firebase ---
    function escutarFirebaseGeral() {
      const rootRef = ref(db);

      onValue(rootRef, (snapshot) => {
        const bancoCompleto = snapshot.val();
        if (!bancoCompleto) return;

        let pastaHidrante = null;
        let caminhoBase = "";

        if (bancoCompleto.historico_hidrantes) {
          pastaHidrante = bancoCompleto.historico_hidrantes;
          caminhoBase = "historico_hidrantes";
        } else {
          for (let key in bancoCompleto) {
            if (key.includes("historico_hidrantes") || key.includes("HIDRANTE")) {
              pastaHidrante = bancoCompleto[key];
              caminhoBase = key;
              break;
            }
          }
        }

        if (!pastaHidrante) return;

        let subChave = Object.keys(pastaHidrante).find(k => k.includes("HIDRANTE"));
        let eventos = subChave ? pastaHidrante[subChave] : pastaHidrante;

        if (eventos && typeof eventos === 'object') {
          const chavesEventos = Object.keys(eventos);
          const ultimaChave = chavesEventos[chavesEventos.length - 1];
          const ultimoEvento = eventos[ultimaChave];

          if (ultimoEvento && typeof ultimoEvento === 'object') {
            if (ultimoEvento.evento === 'ALERTA_MOVIMENTO' && !ultimoEvento.thumb_base64) {
              
              ultimoCaminhoEvento = subChave 
                ? `${caminhoBase}/${subChave}/${ultimaChave}` 
                : `${caminhoBase}/${ultimaChave}`;
                
              capturarECongelarCena(ultimoCaminhoEvento, ultimaChave);
            }
          }
        }
      });
    }

    // Inicializa tudo
    initCamera();
    monitorarConexaoFirebase();
    escutarFirebaseGeral();
    escutarSolicitacoesHD();
  </script>
</body>
</html>
